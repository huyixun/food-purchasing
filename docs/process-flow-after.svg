<text x="500" y="661">校验与效期通过？</text>
<text x="500" y="1195">检验异常？</text>
</g>

<rect x="760" y="470" width="200" height="92" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<g font-size="12" fill="#3C3489">
<text x="776" y="496" font-weight="500">Harness 编排</text>
<text x="776" y="520" font-size="11">决策→工具→回填 ≤5 轮</text>
<text x="776" y="542" font-size="11">每轮落 agent_round_logs</text>
</g>

<rect x="760" y="600" width="200" height="102" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<g font-size="12" fill="#085041">
<text x="776" y="626" font-weight="500">挂起 · 转人工</text>
<text x="776" y="650" font-size="11">缺字段→歧义队列（秦芮）</text>
<text x="776" y="672" font-size="11">block→交接待办（唐映秋）</text>
<text x="776" y="694" font-size="11">结论留痕 · 30 分钟内确认</text>
</g>

<rect x="760" y="1150" width="200" height="92" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<g font-size="12" fill="#791F1F">
<text x="776" y="1176" font-weight="500">隔离 · 禁止配送</text>
<text x="776" y="1200" font-size="11">系统仅上报留痕</text>
<text x="776" y="1222" font-size="11">处置由食安执行 · 报废计损耗</text>
</g>

<rect x="60" y="1180" width="190" height="150" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<g font-size="11" fill="#791F1F">
<text x="72" y="1206" font-size="12" font-weight="500">红线（不变）</text>
<text x="72" y="1230">模型不进数值链路</text>
<text x="72" y="1252">不改效期 · 不放行批次</text>
<text x="72" y="1274">确认/接手/回写/隔离</text>
<text x="72" y="1292">不注册为工具（T3 人工）</text>
<text x="72" y="1314">所有更正只追加不覆盖</text>
</g>

