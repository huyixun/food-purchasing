<svg viewBox="0 0 1000 1620" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>备料流程改造后：备料助手接入后的端到端流程</title>
<desc>在原备料流程上标注备料助手系统的接入点：新增问答与强制中断环节，换算与建议生成由工具链承担，人审红线（确认、隔离、回写）原样保留。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-size="15" font-weight="500" fill="#2C2C2A">备料流程 · 改造后（备料助手接入）</text>
<text x="40" y="58" font-size="11" fill="#5F5E5A">实线为业务流　菱形为判断点　红色为不可逆红线　药丸：新增＝本次引入　增强＝助手辅助　人审＝必须人工　不变＝流程保持</text>
<text x="40" y="76" font-size="11" fill="#5F5E5A">对照改造前：三口径断裂→系统内换算　找人间数→即问即答　口头确认→强制中断卡片　黑盒操作→每轮落日志可审计</text>

