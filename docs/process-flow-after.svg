<g font-size="14" font-weight="500" text-anchor="middle">
<text x="500" y="115" fill="#0C447C">门店订货</text>
<text x="500" y="219" fill="#0C447C">需求合并</text>
<text x="500" y="323" fill="#085041">备料助手问答</text>
<text x="500" y="427" fill="#0C447C">口径换算 · 规则内核</text>
<text x="500" y="531" fill="#0C447C">生成备料建议</text>
<text x="500" y="759" fill="#791F1F">建单前强制中断</text>
<text x="500" y="861" fill="#0C447C">班组长复核</text>
<text x="500" y="963" fill="#0C447C">备料加工</text>
<text x="500" y="1065" fill="#0C447C">批次状态登记</text>
<text x="500" y="1297" fill="#0C447C">配送</text>
<text x="500" y="1399" fill="#0C447C">门店收货</text>
<text x="500" y="1501" fill="#0C447C">盘点与周报</text>
</g>
<g font-size="11" text-anchor="middle">
<text x="500" y="135" fill="#185FA5">按成品份数下单 · 订货平台</text>
<text x="500" y="239" fill="#185FA5">合并后直接进系统 · 不再人工换算</text>
<text x="500" y="343" fill="#0F6E56">制度·效期·批次 即问即答 · 回答附引用来源</text>
<text x="500" y="447" fill="#185FA5">六要素缺一即拒 · 模型不碰数值</text>
<text x="500" y="551" fill="#185FA5">工具链：校验→效期判定→起草草案</text>
<text x="500" y="779" fill="#A32D2D">员工确认卡片 · 凭证 10 分钟内有效</text>
<text x="500" y="881" fill="#185FA5">采用或改判均留痕 · 与改造前一致</text>
<text x="500" y="983" fill="#185FA5">9,000 份/日 · 流程不变</text>
<text x="500" y="1085" fill="#185FA5">六态可查：待检·合格·隔离·解冻·临期·报废</text>
<text x="500" y="1317" fill="#185FA5">门店可售份数</text>
<text x="500" y="1419" fill="#185FA5">缺配登记 · 叶书</text>
<text x="500" y="1521" fill="#185FA5">误判复盘 · 规则回写（outbox 规划中）</text>
</g>

