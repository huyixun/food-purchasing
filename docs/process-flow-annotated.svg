<svg viewBox="0 0 1000 1450" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>备料流程三类标注图：费时、人审、隐私</title>
<desc>备料端到端流程图上标注三类要点：费钱费时的环节、必须人工审核的环节、涉及数据隐私的环节。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-size="15" font-weight="500" fill="#2C2C2A">备料流程 · 成本、人审、隐私三类标注</text>
<text x="40" y="60" font-size="11" fill="#5F5E5A">实线为业务流　菱形为判断点　红色为不可逆红线　节点右侧药丸：费时＝费钱/费时　人审＝必须人工审核　隐私＝涉及数据隐私</text>

